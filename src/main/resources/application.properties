spring.application.name=SistemaDeVeterinario


spring.datasource.url=jdbc:h2:mem:veterinariadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=



spring.jpa.hibernate.ddl-auto=update
# muestra en la consola el SQL que genera JPA (útil para la exposición)
spring.jpa.show-sql=true


# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:veterinariadb, usuario: sa, sin contraseña)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.jpa.properties.jakarta.persistence.validation.mode=none