<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 fw-bold" style="color:#6C4E31;">Gestión de Clientes</h1>
            <a href="/admin/clientes/nuevo" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                + Nuevo Cliente
            </a>
        </section>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th><th>DNI</th><th>Teléfono</th><th>Email</th>
                        <th>Citas Completadas</th>
                        <th>Citas este mes</th>
                        <th>Gasto acumulado</th>
                        <th>Beneficios</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.dni}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.email}"></td>
                        <td th:text="${cliente.citasCompletadas}"></td>
                        <td th:text="${cliente.citasEsteMes}"></td>

                       
                        <td>
                            <strong th:text="'S/ ' + ${#numbers.formatDecimal(cliente.gastoTotal, 1, 2)}"></strong>
                            <br>
                            <span class="badge text-white" style="background-color:#2E7D32;"
                                  th:if="${reglas.esVip(cliente)}">VIP: llegó a S/ 300</span>
                            <small class="text-muted" th:unless="${reglas.esVip(cliente)}"
                                   th:text="'Faltan S/ ' + ${#numbers.formatDecimal(300 - cliente.gastoTotal, 1, 2)} + ' para VIP'"></small>
                        </td>

                        <td>
                            <span th:if="${reglas.tieneDescuentoFidelidad(cliente)}" class="badge text-white" style="background-color:#2E7D32;">15% dscto</span>
                            <span th:if="${reglas.esVip(cliente)}" class="badge bg-warning text-dark">VIP</span>
                            <span th:if="${reglas.tieneServicioGratis(cliente)}" class="badge bg-primary">Servicio gratis</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Editar</a>
                            <a th:href="@{/admin/clientes/eliminar/{id}(id=${cliente.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Seguro que deseas eliminar este cliente?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
