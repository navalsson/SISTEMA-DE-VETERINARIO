<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 fw-bold" style="color:#6C4E31;">Gestión de Categorías</h1>
            <a th:href="@{/admin/categorias/nuevo}" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                + Nueva Categoría
            </a>
        </section>

        <div class="alert alert-danger small" th:if="${error}" th:text="${error}"></div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Nombre</th><th>Tipo</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.nombre}"></td>
                        <td>
                            <span th:if="${categoria.tipo == 'Servicio'}"
                                  class="badge text-white" style="background-color:#2E7D32;">Servicio</span>
                            <span th:unless="${categoria.tipo == 'Servicio'}"
                                  class="badge text-white" style="background-color:#6C4E31;">Producto</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/categorias/editar/{id}(id=${categoria.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Editar</a>
                            <form th:action="@{/admin/categorias/eliminar/{id}(id=${categoria.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Seguro que deseas eliminar esta categoría?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
