<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <h1 class="h4 fw-bold mb-3" style="color:#6C4E31;">
            <span th:if="${cliente.id == null}">Nuevo Cliente</span>
            <span th:if="${cliente.id != null}">Editar Cliente</span>
        </h1>

        <div class="card border-0 shadow-sm p-4" style="max-width:500px;">
            <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{fechaRegistro}">
                <input type="hidden" th:field="*{citasCompletadas}">
                <input type="hidden" th:field="*{gastoTotal}">
                <input type="hidden" th:field="*{citasEsteMes}">

                <div class="mb-3">
                    <label class="form-label fw-bold small">Nombre completo</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">DNI</label>
                    <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Teléfono</label>
                    <input type="text" class="form-control" th:field="*{telefono}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" required>
                </div>

                <button type="submit" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                    Guardar
                </button>
                <a href="/admin/clientes" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
