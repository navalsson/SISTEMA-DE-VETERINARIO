<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 fw-bold" style="color:#6C4E31;">Gestión de Servicios</h1>
            <a href="/admin/servicios/nuevo" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                + Nuevo Servicio
            </a>
        </section>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Servicio</th><th>Categoría</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td th:text="${servicio.nombre}"></td>
                        <td th:text="${servicio.categoria}"></td>
                        <td th:text="'S/ ' + ${servicio.precio}"></td>
                        <td>
                            <span th:if="${servicio.estado == 'Activo'}"
                                  class="badge text-white" style="background-color:#2E7D32;">Activo</span>
                            <span th:unless="${servicio.estado == 'Activo'}"
                                  class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/servicios/editar/{id}(id=${servicio.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Editar</a>
                            <a th:href="@{/admin/servicios/eliminar/{id}(id=${servicio.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Seguro que deseas eliminar este servicio?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
