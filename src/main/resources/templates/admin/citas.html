<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Citas | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 fw-bold" style="color:#6C4E31;">Gestión de Citas</h1>
            <a href="/admin/citas/nuevo" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                + Nueva Cita
            </a>
        </section>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Cliente</th><th>Mascota</th><th>Servicio</th><th>Fecha y Hora</th>
                        <th>Método de Pago</th><th>Estado</th><th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cita : ${citas}">
                        <td>
                            <span th:each="cliente : ${clientes}" th:if="${cliente.id == cita.clienteId}"
                                  th:text="${cliente.nombre}"></span>
                        </td>
                        <td>
                            <span th:each="mascota : ${mascotas}" th:if="${mascota.id == cita.mascotaId}"
                                  th:text="${mascota.nombre}"></span>
                        </td>
                        <td>
                            <span th:each="servicio : ${servicios}" th:if="${servicio.id == cita.servicioId}"
                                  th:text="${servicio.nombre}"></span>
                        </td>
                        <td th:text="${#temporals.format(cita.fechaHora, 'dd MMM - hh:mm a')}"></td>
                        <td>
                            <span th:if="${cita.metodoPago == 'Tarjeta'}"
                                  class="badge text-white" style="background-color:#2E7D32;">Tarjeta (5% dscto)</span>
                            <span th:unless="${cita.metodoPago == 'Tarjeta'}"
                                  class="badge bg-secondary" th:text="${cita.metodoPago}">Efectivo</span>
                            <br>
                            <small th:text="'S/ ' + ${#numbers.formatDecimal(cita.montoPagado, 1, 2)}"></small>
                        </td>
                        <td>
                            <span th:if="${cita.estado == 'Confirmada'}"
                                  class="badge text-white" style="background-color:#2E7D32;">Confirmada</span>
                            <span th:if="${cita.estado == 'Cancelada'}"
                                  class="badge bg-danger">Cancelada</span>
                            <span th:if="${cita.estado == 'Completada'}"
                                  class="badge bg-primary">Completada</span>
                            <span th:if="${cita.estado == 'No Show'}"
                                  class="badge bg-warning text-dark">No Show</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/citas/ver/{id}(id=${cita.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Ver</a>
                            <a th:href="@{/admin/citas/editar/{id}(id=${cita.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Editar</a>
                            <a th:href="@{/admin/citas/eliminar/{id}(id=${cita.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Seguro que deseas eliminar esta cita?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
