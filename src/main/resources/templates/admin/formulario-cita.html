<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cita | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <h1 class="h4 fw-bold mb-3" style="color:#6C4E31;">
            <span th:if="${cita.id == null}">Nueva Cita</span>
            <span th:if="${cita.id != null}">Editar Cita</span>
        </h1>

        <div class="card border-0 shadow-sm p-4" style="max-width:500px;">
            <form novalidate th:action="@{/admin/citas/guardar}" th:object="${cita}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold small">Cliente</label>
                    <select class="form-select" th:field="*{clienteId}" required>
                        <option value="">Selecciona un cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Mascota</label>
                    <select class="form-select" th:field="*{mascotaId}" required>
                        <option value="">Selecciona una mascota</option>
                        <option th:each="m : ${mascotas}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mascotaId')}" th:errors="*{mascotaId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Servicio</label>
                    <select class="form-select" th:field="*{servicioId}" required>
                        <option value="">Selecciona un servicio</option>
                        <option th:each="s : ${servicios}" th:value="${s.id}" th:text="${s.nombre}"></option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('servicioId')}" th:errors="*{servicioId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Fecha y hora</label>
                    <input type="datetime-local" class="form-control" th:field="*{fechaHora}" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Método de pago</label>
                    <select class="form-select" th:field="*{metodoPago}" required>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta">Tarjeta</option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('metodoPago')}" th:errors="*{metodoPago}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Monto pagado (S/)</label>
                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{montoPagado}" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('montoPagado')}" th:errors="*{montoPagado}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Estado</label>
                    <select class="form-select" th:field="*{estado}" required>
                        <option value="Confirmada">Confirmada</option>
                        <option value="Completada">Completada</option>
                        <option value="No Show">No Show</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                </div>

                <button type="submit" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                    Guardar
                </button>
                <a href="/admin/citas" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
