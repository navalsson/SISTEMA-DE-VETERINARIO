<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Farmacia | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 fw-bold" style="color:#6C4E31;">Gestión de Farmacia</h1>
            <a href="/admin/productos/nuevo" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                + Nuevo Producto
            </a>
        </section>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Vendidos</th><th>Ingresos</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.nombre}"></td>
                        <td th:text="${producto.categoria}"></td>
                        <td th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></td>
                        <td>
                            <span th:text="${producto.stock}"></span>
                            <span th:if="${producto.stock < 5}" class="badge bg-danger ms-1">Stock bajo</span>
                        </td>
                        <td th:text="${ventas.unidadesVendidas(producto.id)}">0</td>
                        <td>
                            <strong th:text="'S/ ' + ${#numbers.formatDecimal(ventas.ingresos(producto.id), 1, 2)}">S/ 0.00</strong>
                        </td>
                        <td>
                            <a th:href="@{/admin/productos/editar/{id}(id=${producto.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Editar</a>
                            <a th:href="@{/admin/productos/eliminar/{id}(id=${producto.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
