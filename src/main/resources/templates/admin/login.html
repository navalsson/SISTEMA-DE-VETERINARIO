<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinaria Patitas Felices - Acceso Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<!-- NAVBAR -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #6C4E31;">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/usuario/inicio}">Patitas Felices</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuario/inicio}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuario/servicios}">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuario/faq}">FAQ</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/usuario/contacto}">Contacto</a></li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn text-white fw-bold" style="background-color: #2E7D32;"
                           th:href="@{/usuario/reserva}">Reservar Cita</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-3">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3"
                                 style="background-color: #F9F6F0;">
                                <span class="fs-2">🔒</span>
                            </div>
                        </div>

                        <h1 class="h4 text-center fw-bold mb-3" style="color: #6C4E31;">Acceso Administrador</h1>

                        <div class="alert alert-danger small" th:if="${error}" th:text="${error}"></div>

                        <form th:action="@{/admin/login}" th:object="${administrador}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Usuario</label>
                                <input type="text" class="form-control" th:field="*{usuario}"
                                       placeholder="admin@patitasfelices.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                       placeholder="••••••••" required>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn text-white fw-bold py-2" style="background-color: #2E7D32;">
                                    Iniciar Sesión
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
