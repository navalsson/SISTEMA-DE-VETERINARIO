<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Categoría | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <h1 class="h4 fw-bold mb-3" style="color:#6C4E31;">
            <span th:if="${categoria.id == null}">Nueva Categoría</span>
            <span th:if="${categoria.id != null}">Editar Categoría</span>
        </h1>

        <div class="card border-0 shadow-sm p-4" style="max-width:500px;">
            <form novalidate th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold small">Nombre de la categoría</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Tipo</label>

                    <select class="form-select" th:field="*{tipo}" th:if="${categoria.id == null}" required>
                        <option value="">Selecciona</option>
                        <option value="Servicio">Servicio</option>
                        <option value="Producto">Producto</option>
                    </select>


                    <div th:if="${categoria.id != null}">
                        <input type="text" class="form-control bg-light" th:value="${categoria.tipo}" readonly>
                        <input type="hidden" th:field="*{tipo}">
                    </div>

                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                </div>

                <button type="submit" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                    Guardar
                </button>
                <a th:href="@{/admin/categorias}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
