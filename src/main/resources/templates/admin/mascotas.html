<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Mascotas | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <section class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 fw-bold" style="color:#6C4E31;">Gestión de Mascotas</h1>
            <a href="/admin/mascotas/nuevo" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                + Nueva Mascota
            </a>
        </section>

        <div class="alert alert-light border small mb-3">
            <strong>Restricción de Especies:</strong> el sistema solo admite el registro de perros y gatos.
        </div>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Mascota</th><th>Especie</th><th>Raza</th><th>Edad</th>
                        <th>Sexo</th><th>Peso (kg)</th><th>Dueño</th><th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="mascota : ${mascotas}">
                        <td th:text="${mascota.nombre}"></td>
                        <td th:text="${mascota.especie}"></td>
                        <td th:text="${mascota.raza}"></td>
                        <td th:text="${mascota.edad}"></td>
                        <td th:text="${mascota.sexo}"></td>
                        <td th:text="${mascota.peso}"></td>
                        <td>
                            <span th:each="cliente : ${clientes}" th:if="${cliente.id == mascota.clienteId}"
                                  th:text="${cliente.nombre}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/mascotas/editar/{id}(id=${mascota.id})}"
                               class="btn btn-sm" style="border:1px solid #6C4E31; color:#6C4E31;">Editar</a>
                            <a th:href="@{/admin/mascotas/eliminar/{id}(id=${mascota.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Seguro que deseas eliminar esta mascota?')">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
