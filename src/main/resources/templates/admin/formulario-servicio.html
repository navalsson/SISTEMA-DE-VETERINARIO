<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Servicio | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <h1 class="h4 fw-bold mb-3" style="color:#6C4E31;">
            <span th:if="${servicio.id == null}">Nuevo Servicio</span>
            <span th:if="${servicio.id != null}">Editar Servicio</span>
        </h1>

        <div class="card border-0 shadow-sm p-4" style="max-width:500px;">
            <form th:action="@{/admin/servicios/guardar}" th:object="${servicio}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold small">Nombre del servicio</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Categoría</label>
                    <select class="form-select" th:field="*{categoria}" required>
                        <option value="">Selecciona</option>
                        <option value="Servicio Médico">Servicio Médico</option>
                        <option value="Estética">Estética</option>
                        <option value="Farmacia">Farmacia</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Precio (S/)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Estado</label>
                    <select class="form-select" th:field="*{estado}" required>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <button type="submit" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                    Guardar
                </button>
                <a href="/admin/servicios" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
