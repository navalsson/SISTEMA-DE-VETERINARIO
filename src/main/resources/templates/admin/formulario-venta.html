<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Venta | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout-admin :: header}"></div>

<div class="d-flex">
    <div th:replace="~{fragments/layout-admin :: sidebar(${paginaActiva})}"></div>

    <main class="flex-grow-1 p-4">
        <h1 class="h4 fw-bold mb-3" style="color:#6C4E31;">
            Editar Venta N° <span th:text="${venta.id}">1</span>
        </h1>

        <div class="alert alert-danger small" style="max-width:500px;" th:if="${error}" th:text="${error}"></div>

        <div class="card border-0 shadow-sm p-4" style="max-width:500px;">

            <!-- Datos que no se pueden cambiar -->
            <p class="d-flex justify-content-between small border-bottom pb-2">
                <span>Cliente</span>
                <strong th:text="${venta.cliente.nombre} + ' (DNI ' + ${venta.cliente.dni} + ')'"></strong>
            </p>
            <p class="d-flex justify-content-between small border-bottom pb-2">
                <span>Producto</span>
                <strong th:text="${venta.producto.nombre}"></strong>
            </p>
            <p class="d-flex justify-content-between small border-bottom pb-2">
                <span>Precio unitario</span>
                <strong th:text="'S/ ' + ${#numbers.formatDecimal(venta.producto.precio, 1, 2)}"></strong>
            </p>
            <p class="d-flex justify-content-between small border-bottom pb-2">
                <span>Fecha</span>
                <strong th:text="${venta.fecha != null} ? ${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')} : '-'"></strong>
            </p>
            <p class="d-flex justify-content-between small border-bottom pb-3">
                <span>Total actual</span>
                <strong style="color:#2E7D32;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.monto, 1, 2)}"></strong>
            </p>

            <!-- Datos que sí se pueden cambiar -->
            <form th:action="@{/admin/ventas/guardar}" method="post">

                <input type="hidden" name="id" th:value="${venta.id}">

                <div class="mb-3">
                    <label for="cantidad" class="form-label fw-bold small">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" name="cantidad"
                           min="1" th:value="${venta.cantidad}" required>
                    <div class="form-text"
                         th:text="'Máximo para esta venta: ' + ${venta.producto.stock + venta.cantidad} + ' unidades'"></div>
                </div>

                <div class="mb-3">
                    <label for="metodoPago" class="form-label fw-bold small">Método de pago</label>
                    <select class="form-select" id="metodoPago" name="metodoPago" required>
                        <option value="Efectivo" th:selected="${venta.metodoPago == 'Efectivo'}">Efectivo</option>
                        <option value="Tarjeta" th:selected="${venta.metodoPago == 'Tarjeta'}">Tarjeta (5% dscto)</option>
                    </select>
                </div>

                <div class="alert alert-light border small">
                    Al guardar, el total se recalcula con las reglas de negocio, y el stock del producto
                    y el gasto acumulado del cliente se ajustan automáticamente.
                </div>

                <button type="submit" class="btn text-white fw-bold" style="background-color:#2E7D32;">
                    Guardar
                </button>
                <a th:href="@{/admin/ventas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout-admin :: footer}"></div>

</body>
</html>
