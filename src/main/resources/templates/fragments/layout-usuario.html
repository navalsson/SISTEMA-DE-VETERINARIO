<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header(activa)">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#6C4E31;">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/usuario/inicio}">🐾 Patitas Felices</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activa == 'inicio'} ? 'active fw-bold' : ''"
                           th:href="@{/usuario/inicio}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activa == 'servicios'} ? 'active fw-bold' : ''"
                           th:href="@{/usuario/servicios}">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activa == 'faq'} ? 'active fw-bold' : ''"
                           th:href="@{/usuario/faq}">FAQ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activa == 'contacto'} ? 'active fw-bold' : ''"
                           th:href="@{/usuario/contacto}">Contacto</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn text-white fw-bold" style="background-color:#2E7D32;"
                           th:href="@{/usuario/reserva}">Reservar Cita</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>


<footer th:fragment="footer" class="text-white py-3 mt-auto" style="background-color:#6C4E31;">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <p class="mb-0 small">&copy; 2026 Clínica Veterinaria Patitas Felices. Todos los derechos reservados.</p>
        <a th:href="@{/admin/login}" class="small text-white text-decoration-none">🔒 Acceso Administrador</a>
    </div>
</footer>


<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
