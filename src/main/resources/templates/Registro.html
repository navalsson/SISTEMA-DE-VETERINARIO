<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color:#FFF8DC;">

<header>
    <nav class="navbar navbar-dark" style="background-color:#6C4E31;">
        <div class="container">
            <span class="navbar-brand fw-bold mb-0">🐾 Patitas Felices</span>
        </div>
    </nav>
</header>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="h4 text-center fw-bold mb-3" style="color:#6C4E31;">Crear cuenta</h1>

                        <form novalidate th:action="@{/registro}" th:object="${cliente}" method="post">

                            <div class="alert alert-danger small" th:if="${#fields.hasErrors('*')}">
                                <ul class="mb-0">
                                    <li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li>
                                </ul>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nombre completo</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">DNI (será tu usuario)</label>
                                <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Teléfono</label>
                                <input type="text" class="form-control" th:field="*{telefono}" maxlength="9" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Correo electrónico</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Contraseña (mínimo 6 caracteres)</label>
                                <input type="password" class="form-control" name="password" required>
                                <div class="text-danger small mt-1" th:if="${errorPassword}" th:text="${errorPassword}"></div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn text-white fw-bold py-2"
                                        style="background-color:#2E7D32;">
                                    Registrarme
                                </button>
                            </div>
                        </form>

                        <p class="text-center small mt-3 mb-0">
                            ¿Ya tienes cuenta? <a th:href="@{/login}" style="color:#6C4E31;">Inicia sesión</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
