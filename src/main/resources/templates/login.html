<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color:#FFF8DC;">

<header>
    <nav class="navbar navbar-dark" style="background-color:#6C4E31;">
        <div class="container">
            <span class="navbar-brand fw-bold mb-0">🐾 Patitas Felices</span>
        </div>
    </nav>
</header>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-3">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3"
                                 style="background-color:#F9F6F0;">
                                <span class="fs-2">🔒</span>
                            </div>
                        </div>

                        <h1 class="h4 text-center fw-bold mb-3" style="color:#6C4E31;">Iniciar sesión</h1>

                        <div class="alert alert-danger small" th:if="${error}" th:text="${error}"></div>
                        <div class="alert alert-success small" th:if="${param.registrado}">
                            Cuenta creada. Ya puedes iniciar sesión.
                        </div>
                        <div class="alert alert-info small" th:if="${param.logout}">
                            Cerraste sesión correctamente.
                        </div>

                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-semibold">DNI o usuario</label>
                                <input type="text" class="form-control" id="usuario" name="usuario"
                                       placeholder="Ej. 45678912" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="••••••••" required>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn text-white fw-bold py-2"
                                        style="background-color:#2E7D32;">
                                    Iniciar Sesión
                                </button>
                            </div>
                        </form>

                        <p class="text-center small mt-3 mb-0">
                            ¿No tienes cuenta? <a th:href="@{/registro}" style="color:#6C4E31;">Regístrate</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
