<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinaria Patitas Felices - Reservar Cita (Paso 2)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100" style="background-color:#FFF8DC;">

<div th:replace="~{fragments/layout-usuario :: header('')}"></div>

<main class="container flex-grow-1 my-5" style="max-width:700px;">

    <section class="text-center mb-3">
        <h1 class="fw-bold" style="color: #6C4E31;">Reserva tu Cita</h1>
        <p class="text-muted">Paso 2 de 3: elige la fecha y el horario disponible.</p>
    </section>

    <div class="d-flex justify-content-center align-items-center gap-2 mb-4">
        <span class="badge rounded-pill text-white" style="background-color: #2E7D32;">✓</span>
        <span class="text-muted">Servicio</span>
        <div class="border-top flex-grow-0" style="width:40px;"></div>
        <span class="badge rounded-pill text-white" style="background-color: #2E7D32;">2</span>
        <span style="color: #6C4E31;">Horario</span>
        <div class="border-top flex-grow-0" style="width:40px;"></div>
        <span class="badge bg-secondary rounded-pill">3</span>
        <span class="text-muted">Datos y Pago</span>
    </div>

    <div class="alert alert-danger small" th:if="${param.error}">
        Ese horario acaba de ser tomado. Elige otro.
    </div>

    <!-- FECHA (calendario) y DNI: al cambiar la fecha se recargan los horarios -->
    <form class="card border-0 shadow-sm p-3 mb-4" th:action="@{/usuario/reserva2}" method="get">
        <input type="hidden" name="servicioId" th:value="${servicioId}">

        <div class="row g-3 align-items-end">
            <div class="col-md-6">
                <label for="fecha" class="form-label fw-bold small" style="color:#6C4E31;">Elige la fecha</label>
                <input type="date" id="fecha" name="fecha" class="form-control"
                       th:value="${fecha}" th:min="${hoy}" th:max="${maxima}"
                       onchange="this.form.submit()">
            </div>
            <div class="col-md-6">
                <label for="dni" class="form-label fw-bold small" style="color:#6C4E31;">¿Ya eres cliente? Ingresa tu DNI</label>
                <div class="input-group">
                    <input type="text" id="dni" name="dni" class="form-control" maxlength="8"
                           placeholder="Ej. 45678912" th:value="${dni}">
                    <button class="btn btn-outline-secondary">Ver horarios</button>
                </div>
            </div>
        </div>
    </form>

    <div class="alert alert-light border small" th:if="${vip}">
        Eres cliente VIP: tienes horarios exclusivos.
    </div>

    <!-- HORARIOS DEL DÍA ELEGIDO -->
    <h2 class="h6 fw-bold mb-2" style="color:#6C4E31;">
        Horarios disponibles para el
        <span th:text="${#temporals.format(fecha, 'dd/MM/yyyy')}">23/10/2026</span>
    </h2>

    <div class="alert alert-warning small" th:if="${domingo}">
        Los domingos no hay atención. Elige otro día.
    </div>

    <div class="row row-cols-3 row-cols-md-4 g-2 mb-4">
        <div class="col" th:each="h : ${horarios}">

            <button th:if="${ocupados.contains(h)}"
                    class="btn btn-outline-secondary w-100" disabled>
                <s th:text="${h}">10:00</s>
            </button>

            <a th:unless="${ocupados.contains(h)}"
               class="btn btn-outline-secondary w-100"
               th:href="@{/usuario/reserva3(servicioId=${servicioId},fecha=${fecha},hora=${h},dni=${dni})}"
               th:text="${h}">09:00</a>

        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a class="btn" style="border: 1px solid #6C4E31; color: #6C4E31;"
           th:href="@{/usuario/reserva1}">Volver</a>
    </div>

</main>

<div th:replace="~{fragments/layout-usuario :: footer}"></div>
<div th:replace="~{fragments/layout-usuario :: scripts}"></div>

</body>
</html>
