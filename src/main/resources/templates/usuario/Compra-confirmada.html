<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra confirmada - Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100" style="background-color:#FFF8DC;">

<div th:replace="~{fragments/layout-usuario :: header('servicios')}"></div>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">

                    <div class="rounded-circle text-white d-flex align-items-center justify-content-center mx-auto mb-3"
                         style="width:70px; height:70px; background-color:#2E7D32; font-size:32px;">✓</div>

                    <h1 class="fw-bold" style="color:#6C4E31;">¡Tu compra ha sido confirmada!</h1>
                    <p class="text-muted mb-4">Guarda esta boleta. Recoge tu producto en la clínica.</p>

                    <div class="card text-start mb-4" style="background-color:#F9F6F0; border:1px dashed #D9D2C7;">
                        <div class="card-body">

                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">N° de Compra</strong>
                                <span th:text="${venta.id}">1</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">Cliente</strong>
                                <span th:text="${cliente.nombre}">Cliente</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">Producto</strong>
                                <span th:text="${producto.nombre}">Producto</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">Cantidad</strong>
                                <span th:text="${venta.cantidad}">1</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">Precio unitario</strong>
                                <span th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 0.00</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">Método de Pago</strong>
                                <span th:text="${venta.metodoPago}">Efectivo</span>
                            </div>
                            <div class="d-flex justify-content-between border-bottom py-2">
                                <strong style="color:#6C4E31;">Fecha</strong>
                                <span th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy - HH:mm')}">01/01/2026 - 10:00</span>
                            </div>
                            <div class="d-flex justify-content-between py-2">
                                <strong style="color:#6C4E31;">Total Pagado</strong>
                                <span class="fw-bold" style="color:#2E7D32;"
                                      th:text="'S/ ' + ${#numbers.formatDecimal(venta.monto, 1, 2)}">S/ 0.00</span>
                            </div>

                        </div>
                    </div>

                    <div class="row g-3 mt-3">
                        <div class="col-md-6">
                            <a th:href="@{/usuario/inicio}" class="btn w-100 fw-bold"
                               style="border:2px solid #6C4E31; color:#6C4E31;">Volver al Inicio</a>
                        </div>
                        <div class="col-md-6">
                            <a th:href="@{/usuario/servicios}" class="btn text-white w-100 fw-bold"
                               style="background-color:#2E7D32;">Seguir comprando</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout-usuario :: footer}"></div>
<div th:replace="~{fragments/layout-usuario :: scripts}"></div>

</body>
</html>
